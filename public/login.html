<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Gestión de Productos</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f2f4f8; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .card { background:#fff; padding:30px; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.1); width:300px; }
    input, button { width:100%; padding:10px; margin-top:10px; box-sizing:border-box; }
    button { background:#2563eb; color:#fff; border:none; cursor:pointer; border-radius:4px; }
    #msg { margin-top:10px; font-size:14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Iniciar sesión</h2>
    <input type="email" id="email" placeholder="Correo">
    <input type="password" id="password" placeholder="Contraseña">
    <button onclick="login()">Entrar</button>
    <p id="msg"></p>
  </div>

  <script>
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      const msg = document.getElementById('msg');
      if (res.ok) {
        localStorage.setItem('token', data.token);
        msg.textContent = 'Login exitoso. Token guardado.';
      } else {
        msg.textContent = data.mensaje;
      }
    }
  </script>
</body>
</html>
